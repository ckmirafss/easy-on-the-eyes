name: freshness
# Runs weekly. Fails when browser support or a framework's major version has moved
# since the facts in the skill were last checked, so the docs get reviewed.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tests/freshness.mjs
